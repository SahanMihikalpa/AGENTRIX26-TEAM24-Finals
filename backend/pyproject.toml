[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "govguide-backend"
version = "0.1.0"
description = "GovGuide — agentic AI navigator for Sri Lankan government & citizen services (backend)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }

# Runtime dependencies grow per implementation stage (see docs/10-backend-implementation.md).
dependencies = [
    # ── Delivery + settings (Stage 0) ───────────────────────────────
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # ── Agent runtime: LangGraph + LangChain 1.x (Stage 4–5) ─────────
    # NOTE: LangChain/LangGraph are now 1.x. We depend on the specific
    # packages we use (graph + checkpointer + provider adapters), not the
    # `langchain` umbrella — cleaner for the hexagonal layout (our agents
    # call the `LLMProvider` port, not LangChain directly).
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",  # SqliteSaver checkpointer (AD-3)
    "langchain-core>=1.4,<2",               # messages, structured output, runnables
    "langchain-google-genai>=4.2,<5",       # Gemini Flash provider (AD-6)
    "langchain-groq>=1.1,<2",               # Groq fallback provider (AD-6)
    # ── Data layer: KB store + local embeddings (Stage 2) ────────────
    "chromadb>=1.5,<2",                      # vector store (no torch dependency)
    "sentence-transformers>=5,<6",          # local bge-base-en-v1.5 embeddings (pulls torch)
    # ── External tools: web research + document parsing (Stage 3) ────
    # (langchain-groq, declared above, is the fallback LLMProvider used from Stage 3.)
    "tavily-python>=0.7,<1",                 # Tavily web search — primary WebSearch (AD-7/QA-7)
    "ddgs>=9,<10",                           # keyless DuckDuckGo fallback WebSearch
    "pymupdf>=1.24,<2",                      # PDF text extraction — SourceParser (B1)
    "trafilatura>=2,<3",                     # HTML main-content extraction — SourceParser (B1)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",        # required by fastapi.testclient
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.adapters.knowledge" = ["*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# A pragmatic-but-strict rule set for clean code.
select = ["E", "F", "I", "B", "UP", "N", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true       # third-party libs without stubs (chromadb, langgraph, ...)
warn_unused_ignores = true
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
